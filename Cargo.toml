[package]
name = "massrelay"
version = "0.5.4"
edition = "2024"
description = "User-mode pocket networks for your own machines"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6"
fs2 = "0.4"
getrandom = "0.3"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "0.6.1"
iroh-relay = { version = "=1.5.0", default-features = false, features = ["server", "tls-ring"] }
portable-pty = "0.9"
# The HTTPS client Iroh already builds, for `massrelay update`.
reqwest = { version = "0.13", default-features = false, features = ["rustls-no-provider"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
hmac = "0.12"
sha2 = "0.10"
socket2 = "0.6"
# Keep the OpenMLS set pinned together. 0.10.0-rc.1 supplies the historical
# per-message lifetime policy that private membership requires (Rust >= 1.94).
openmls = { version = "=0.10.0-rc.1" }
openmls_rust_crypto = { version = "=0.7.0-rc.1" }
openmls_basic_credential = { version = "=0.7.0-rc.1" }
openmls_sqlite_storage = { version = "=0.4.0-rc.1" }
openmls_traits = { version = "=0.7.0-rc.1" }
# Same version as openmls_sqlite_storage 0.4.0-rc.1, which enables `bundled`; the private
# relay's slot store uses the same build.
rusqlite = { version = "0.41", features = ["bundled"] }
ed25519-dalek = { version = "3" }

[target.'cfg(unix)'.dependencies]
# The password database, where OpenSSH finds an account's home directory.
libc = "0.2"

[target.'cfg(windows)'.dependencies]
russh = { version = "=0.65.4", default-features = false, features = ["ring"] }
zeroize = "1"
windows-sys = { version = "0.61", features = [
    "Win32_Foundation",
    "Win32_Security",
    "Win32_Security_Authentication_Identity",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Console",
    "Win32_System_EventLog",
    "Win32_System_IO",
    "Win32_System_Pipes",
    "Win32_System_Services",
    "Win32_System_SystemInformation",
    "Win32_System_Threading",
    "Win32_UI_Shell",
] }

[dev-dependencies]
rcgen = "0.14"
rustls = { version = "0.23", default-features = false }
tokio-rustls = { version = "0.26", default-features = false }

[build-dependencies]
cc = "1"
