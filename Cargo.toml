[package]
name = "massrelay"
version = "0.3.7"
edition = "2024"
description = "User-mode pocket networks for your own machines"

[dependencies]
anyhow = "1"
base64 = "0.22"
chrono = { version = "0.4", default-features = false, features = ["clock"] }
clap = { version = "4.5", features = ["derive", "env"] }
crossterm = "0.29"
directories = "6"
fs2 = "0.4"
getrandom = "0.3"
iroh = { version = "=1.5.0", default-features = false, features = ["tls-ring"] }
iroh-mdns-address-lookup = "0.6.1"
iroh-relay = { version = "=1.5.0", default-features = false, features = ["server", "tls-ring"] }
portable-pty = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
subtle = "2"
tempfile = "3"
tokio = { version = "1", features = ["full"] }
hmac = "0.12"
sha2 = "0.10"
socket2 = "0.6"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61", features = ["Win32_Foundation", "Win32_System_Console"] }
